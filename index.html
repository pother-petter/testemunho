<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Panfleto QR code</title>

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-Z8CW2MGPRX"></script>

    <script>
        window.dataLayer = window.dataLayer || [];

        function gtag() {
            dataLayer.push(arguments);
        }

        gtag('js', new Date());
        gtag('config', 'G-Z8CW2MGPRX');

        // Identifica os parâmetros da campanha
        const params = new URLSearchParams(window.location.search);

        const source = params.get('utm_source');
        const medium = params.get('utm_medium');
        const campaign = params.get('utm_campaign');

        // Mostra a origem no título da página
        if (source) {
            document.title = 'Panfleto QR code — ' + source;
        }

        // Envia a campanha explicitamente para o GA4
        if (source) {
            gtag('event', 'campaign_visit', {
                campaign_source: source,
                campaign_medium: medium,
                campaign_name: campaign
            });
        }

        // Redireciona para o YouTube após 1 segundo
        setTimeout(function() {
            window.location.href =
                'https://www.youtube.com/playlist?list=PLANcnf-hsZ85GXJoTp3lzhLg31sEymIo_';
        }, 1000);
    </script>
</head>

<body>
    <p>carregando conteúdo do YouTube...</p>
</body>
</html>
